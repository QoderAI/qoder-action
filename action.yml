name: 'Qoder Action'
description: 'Integrate Qoder AI into your GitHub Actions workflow. Automate code reviews, refactoring, and development tasks with an intelligent agent.'
author: 'Qoder AI'

branding:
  icon: 'code'
  color: 'green'

inputs:
  prompt:
    description: 'Instructions for qodercli (passed to -p flag)'
    required: true
  
  flags:
    description: |
      Additional CLI arguments to pass to qodercli.
      Multiple lines are supported.
    required: false
    default: ''

  qoder_personal_access_token:
    description: 'Your Qoder Personal Access Token. Must be stored as a GitHub Secret (e.g., secrets.QODER_PERSONAL_ACCESS_TOKEN).'
    required: true

  qodercli_version:
    description: 'Specific version of qodercli to install. The default version is tested and optimized for this action. Changing it is not recommended and may lead to unexpected behavior.'
    required: false
    default: '0.1.18'

  enable_github_mcp:
    description: 'Enable the official GitHub MCP Server. Defaults to true when neither this input nor the deprecated alias is set.'
    required: false
    default: ''

  enable_qoder_github_mcp:
    description: 'Deprecated alias for enable_github_mcp. It will be removed in v1.'
    required: false
    default: ''

outputs:
  output_file:
    description: 'Path to the file containing qodercli stdout output (formatted as stream-json).'
    value: ${{ steps.run_cli.outputs.output_file }}
  
  error:
    description: 'Error message from qodercli if the execution failed.'
    value: ${{ steps.run_cli.outputs.error }}

runs:
  using: 'composite'
  steps:
    - name: Remove legacy qoder-github MCP configuration
      id: remove_legacy_github_mcp
      shell: bash
      run: |
        bash "${GITHUB_ACTION_PATH}/scripts/remove-legacy-github-mcp.sh"

    - name: Install qodercli
      shell: bash
      env:
        QODERCLI_VERSION: ${{ inputs.qodercli_version }}
      run: |
        echo "::group::Installing qodercli"
        echo "Installing qodercli version ${QODERCLI_VERSION} via npm..."
        npm install -g @qoder-ai/qodercli@${QODERCLI_VERSION}
        echo "::endgroup::"
        echo "✓ qodercli installed successfully"
        echo "Installed version: $(qodercli --version)"

    - name: Configure Git Authentication
      id: auth
      shell: bash
      env:
        QODER_PERSONAL_ACCESS_TOKEN: ${{ inputs.qoder_personal_access_token }}
      run: |
        bash "${GITHUB_ACTION_PATH}/scripts/configure-qoder-auth.sh"

    - name: Resolve GitHub MCP configuration
      id: resolve_github_mcp
      shell: bash
      env:
        INPUT_ENABLE_GITHUB_MCP: ${{ inputs.enable_github_mcp }}
        INPUT_ENABLE_QODER_GITHUB_MCP: ${{ inputs.enable_qoder_github_mcp }}
      run: |
        bash "${GITHUB_ACTION_PATH}/scripts/resolve-github-mcp-enabled.sh"

    - name: Run qodercli with optional official GitHub MCP Server
      id: run_cli
      shell: bash
      env:
        ENABLE_GITHUB_MCP: ${{ steps.resolve_github_mcp.outputs.enabled }}
        QODER_PERSONAL_ACCESS_TOKEN: ${{ inputs.qoder_personal_access_token }}
        GITHUB_TOKEN: ${{ steps.auth.outputs.github_token }}
        GITHUB_PERSONAL_ACCESS_TOKEN: ${{ steps.resolve_github_mcp.outputs.enabled == 'true' && steps.auth.outputs.github_token || '' }}
        GITHUB_HOST: ${{ github.server_url }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_FLAGS: ${{ inputs.flags }}
      run: |
        bash "${GITHUB_ACTION_PATH}/scripts/run-qodercli-with-github-mcp.sh"
