name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'
          
      - name: Check JavaScript syntax
        run: node --check scripts/qoder-wrapper.js

      - name: Run deterministic tests
        run: |
          bash tests/github-mcp-scripts.test.sh
          node tests/github-mcp-compat-proxy.test.js
          node tests/redact-sensitive-data.test.js
          node --test tests/detect-trigger.test.js
          ruby tests/action-metadata.test.rb
          ruby tests/assistant-trigger.test.rb
          ruby tests/qoder-resources.test.rb

      - name: Smoke test official GitHub MCP Server image
        run: bash tests/github-mcp-docker-smoke.sh
